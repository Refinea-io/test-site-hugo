{{ define "main" }}
<script type="application/ld+json">{{ dict "@context" "https://schema.org" "@type" "BlogPosting" "headline" .Title "description" .Description "datePublished" (.Date.Format "2006-01-02") | jsonify | safeJS }}</script>
<article>
  {{ with .Params.image }}<img src="{{ . }}" alt="" width="960">{{ end }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</article>
{{ end }}
